name: Deploy Personal Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify exported entry points
        run: |
          test -f out/index.html
          test -f out/test/index.html
          test -f out/scenarios/index.html
          touch out/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A legacy branch deployment is still enabled in the repository. Publish
      # this verified artifact after it, so the application remains live until
      # an administrator switches Pages Source to GitHub Actions.
      - name: Wait for legacy Pages deployment
        run: sleep 90
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
