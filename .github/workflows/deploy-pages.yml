name: Deploy Personal Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Use Actions as the Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const before = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            core.info(`Pages build type: ${before.data.build_type}; URL: ${before.data.html_url}`);
            if (before.data.build_type !== 'workflow') {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                ...repo,
                build_type: 'workflow'
              });
            }
            const after = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            if (after.data.build_type !== 'workflow') {
              core.setFailed('Pages must publish the Next.js artifact through GitHub Actions.');
            }
            core.info(`Pages publishing URL: ${after.data.html_url}`);
      - name: Verify exported entry points
        run: |
          test -f out/index.html
          test -f out/test/index.html
          test -f out/scenarios/index.html
          touch out/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
